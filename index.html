* { box-sizing: border-box; image-rendering: pixelated; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: calc(92 * var(--p)); background: #161617; color: #fff; font: calc(16 * var(--p))/calc(20 * var(--p)) Seven, system-ui, sans-serif; letter-spacing: .4px; }
